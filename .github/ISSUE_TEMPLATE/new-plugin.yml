name: Submit a skill or plugin
description: Share an existing capability or propose a new skill draft for maintainer review.
title: "[submission] "
labels: ["plugin-submission"]
body:
  - type: markdown
    attributes:
      value: |
        This is a review request, not automatic publication or a pull request.
        You can link existing content or describe a new skill. No Git commands
        or corporate email address are required.

        Before publishing, a maintainer confirms the source repository, package
        manifest, version, access requirements, and security review. Plugin content
        lives in its own repository; this marketplace stores catalog records only.
        Do not include credentials, personal data, or confidential customer information.

  - type: input
    id: name
    attributes:
      label: Name
      description: A short, readable name for the capability.
      placeholder: Deal health check
    validations:
      required: true

  - type: input
    id: slug
    attributes:
      label: Suggested identifier
      description: Optional lowercase name with hyphens; a maintainer can help finalize this.
      placeholder: deal-health-check

  - type: dropdown
    id: capability-kind
    attributes:
      label: What are you sharing?
      options:
        - plugin
        - skill
        - agent
        - prompt
        - hook
        - mcp-server
        - extension
      default: 1
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What does it do, and when should someone use it?
      description: A sentence or two describing the task and expected outcome.
    validations:
      required: true

  - type: input
    id: repository
    attributes:
      label: Existing repository
      description: Optional HTTPS link. Leave blank when proposing a new draft below.
      placeholder: https://github.com/your-team/your-skill

  - type: textarea
    id: instructions
    attributes:
      label: Instructions or skill draft
      description: Plain-language instructions or a SKILL.md draft. Provide this or a repository link.
      render: markdown

  - type: input
    id: author
    attributes:
      label: Your name or team
      description: Optional. The GitHub account submitting this issue is credited automatically.

  - type: input
    id: category
    attributes:
      label: Use case
      description: Optional. Describe who this helps or which workflow it belongs to.

  - type: input
    id: version
    attributes:
      label: Version
      description: Optional. Leave blank if this has not been packaged yet.
      placeholder: 1.0.0

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I can share this content with the people who can access this repository.
          required: true
        - label: It contains no secrets, credentials, personal data, or confidential customer information.
          required: true
        - label: I understand a maintainer reviews this request and publication is not automatic.
          required: true
