name: Validate marketplace

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    if: github.event_name == 'pull_request' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0

      - run: bun install --frozen-lockfile

      - name: Validate plugin manifests
        run: bun run validate

      - name: Ensure the catalog is regenerated
        run: bun run marketplace:check

      - name: Test catalog search and URL state
        run: bun run test

      - name: Check types and templates
        run: bun run check

      - name: Build for root hosting
        run: bun run build
        env:
          BASE_PATH: /
          PUBLIC_MARKETPLACE_REPO: ${{ github.repository }}

      - name: Build for repository subpath hosting
        run: bun run build
        env:
          BASE_PATH: /marketplace-smoke/
          PUBLIC_MARKETPLACE_REPO: ${{ github.repository }}

      - name: Install browser for template acceptance tests
        run: bun run test:template:install --with-deps

      - name: Verify Acme adoption on both hosts
        run: bun run test:template
