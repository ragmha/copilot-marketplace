name: Deploy marketplace to GitHub Pages

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    if: >-
      ${{ (vars.DEPLOY_TARGET == '' || vars.DEPLOY_TARGET == 'github-pages') &&
          github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - name: Require the default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/$DEFAULT_BRANCH" ]]; then
            echo "::error::Production builds must run from the repository's default branch."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate catalog and check synchronization
        run: bun run validate && bun run marketplace:check

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
        with:
          enablement: false

      - name: Build site
        run: bun run build
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
          PUBLIC_MARKETPLACE_REPO: ${{ github.repository }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    if: >-
      ${{ (vars.DEPLOY_TARGET == '' || vars.DEPLOY_TARGET == 'github-pages') &&
          github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: github-pages
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
